[package]
name = "openforts-classic-launcher"
version = "0.1.0"
description = "Launcher for OpenForts Classic"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which Cargo needs on
# Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "openforts_classic_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
